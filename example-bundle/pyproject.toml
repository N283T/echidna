[build-system]
requires = ["ChimeraX-BundleBuilder"]
build-backend = "chimerax.bundle_builder.cx_pep517"

[project]
name = "ChimeraX-HelloWorld"
version = "0.1.0"
description = "ChimeraX HelloWorld bundle"
license = { text = "MIT" }
dynamic = ["classifiers", "requires-python"]

[project.urls]
# Homepage = "https://github.com/yourusername/ChimeraX-HelloWorld"

[chimerax]
package = "chimerax.helloworld"
pure = true
min-session-version = 1
max-session-version = 1
categories = ["General"]
classifiers = []

[chimerax.command.hello_world]
category = "General"
description = "ChimeraX HelloWorld bundle"

# Ruff configuration for ChimeraX bundle development
# Generated by echidna setup-ide
[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.ruff.lint.isort]
known-first-party = ["chimerax"]

[tool.ruff.lint]
select = ["E", "F", "I"]
