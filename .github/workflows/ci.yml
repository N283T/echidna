name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']  # Always run on version tags
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Detect which files changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
              - 'templates/**'

  fmt:
    name: Format
    needs: changes
    # Run if: rust files changed OR this is a tag push
    if: needs.changes.outputs.rust == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-features

  build-release:
    name: Build Release (${{ matrix.target }})
    needs: changes
    # Run on push to main/master (if rust changed) OR on tags
    if: |
      github.event_name == 'push' &&
      (needs.changes.outputs.rust == 'true' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: echidna-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/echidna
            target/${{ matrix.target }}/release/echidna.exe
          if-no-files-found: ignore

  # Summary job for branch protection (always runs)
  ci-success:
    name: CI Success
    needs: [changes, fmt, clippy, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          # If no rust changes, that's a pass
          if [ "${{ needs.changes.outputs.rust }}" != "true" ] && [ "${{ github.ref_type }}" != "tag" ]; then
            echo "No Rust changes detected, skipping checks"
            exit 0
          fi
          # Otherwise check if all jobs passed
          if [ "${{ needs.fmt.result }}" == "failure" ] || \
             [ "${{ needs.clippy.result }}" == "failure" ] || \
             [ "${{ needs.test.result }}" == "failure" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
